name: Validate distributable sources

on:
  push:
    branches: [main, developing]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  data-and-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install fonttools
      - name: Validate complete and current language packs
        run: python scripts/build_multilingual.py --check
      - name: Check distributable files, notices and locale glyphs
        run: python scripts/check_publication.py
